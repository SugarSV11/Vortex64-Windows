name: Build (Linux)

# Vortex64-Windows: inherited from the Linux project; manual only (the Windows workflow is windows.yml). Not validated for this repository.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libsdl2-dev qt6-base-dev libqt6dbus6 libgl-dev libx11-dev \
            libpipewire-0.3-dev libasound2-dev libfreetype-dev libpng-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPJ64_GLIDEN64=OFF
      - name: Build
        run: cmake --build build
      - name: Tests
        run: |
          cmake --build build --target check
          ctest --test-dir build --output-on-failure
