name: Build (Windows)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # to attach the portable ZIP to a release on tags

jobs:
  windows-x64:
    runs-on: windows-latest
    env:
      VCPKG_ROOT: C:\vcpkg
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Configure (Release)
        run: cmake --preset windows-msvc-release -DVORTEX_BUILD_GUI=ON -DVCPKG_MANIFEST_FEATURES=gui

      - name: Build (Release)
        run: cmake --build --preset windows-msvc-release

      - name: Build tests
        run: cmake --build --preset windows-msvc-release --target common-test core-test rsp-test jit-fuzz-test fake-test-rom

      - name: Tests (ctest; the ~3 minute directed JIT suite runs too)
        # the CPU tests need an OpenGL context (the plugins are loaded the way the application does);
        # windows-latest runners provide a software renderer
        run: ctest --test-dir build/windows-msvc-release --output-on-failure

      - name: Package portable ZIP
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Version "${{ github.ref_type == 'tag' && github.ref_name || github.sha }}"

      - uses: actions/upload-artifact@v4
        with:
          name: Vortex64-Windows-x64
          path: |
            dist/*.zip
            dist/*.sha256

      - name: Attach to release (tags only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
